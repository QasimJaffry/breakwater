<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Breakwater: see who breaks before you ship</title>
<desc id="d">A field map for a pull request that removes courier.phone and loyalty and changes the type of eta. Android, iOS and web versions that read each field are filled in. Four breaking changes reach 100 percent of active installs, while legacyTip, which nobody reads, is safe to remove.</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6ee7b7"/><stop offset=".55" stop-color="#8ab4ff"/><stop offset="1" stop-color="#c4a5ff"/></linearGradient></defs>
<rect width="1200" height="440" rx="24" fill="#070b14"/><rect x=".5" y=".5" width="1199" height="439" rx="23.5" fill="none" stroke="#172036"/>
<g id="title-block">
<text x="56" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" letter-spacing="2" fill="#7f8db0">API COMPATIBILITY · MOBILE + WEB</text>
<text x="56" y="172" font-size="80" font-weight="800" letter-spacing="-2" fill="#f2f5fc">Breakwater</text>
<text x="56" y="226" font-size="34" font-weight="700" fill="url(#g)">See who breaks</text>
<text x="56" y="266" font-size="34" font-weight="700" fill="url(#g)">before you ship.</text>
<text x="56" y="318" font-size="22" fill="#a9b4cd">Records which API fields each shipped</text>
<text x="56" y="348" font-size="22" fill="#a9b4cd">app version really reads, then tells</text>
<text x="56" y="378" font-size="22" fill="#a9b4cd">every PR how many users it breaks.</text>
<text x="56" y="416" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#5f6d8c">React Native · Web · OpenAPI · MIT</text>
</g>

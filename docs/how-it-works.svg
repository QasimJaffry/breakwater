<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">How Breakwater works</title>
<desc id="d">Three steps. First, an SDK in the app records the paths of response fields the code reads, never the values. Second, a collector counts reads and active installs per field and app version. Third, a CI check diffs the OpenAPI spec, joins it with real reads, and fails the pull request when users would break.</desc>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto"><path d="M1 1 L9 6 L1 11" fill="none" stroke="#6f7c99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="300" rx="24" fill="#070b14"/><rect x=".5" y=".5" width="1199" height="299" rx="23.5" fill="none" stroke="#172036"/>
<g id="step-1">
<rect x="56" y="36" width="320" height="228" rx="18" fill="#0e1424" stroke="#1c2742"/>
<rect x="56" y="36" width="320" height="5" rx="2.5" fill="#59d9a0"/>
<circle cx="94" cy="80" r="17" fill="#59d9a0"/><text x="94" y="87" font-size="20" font-weight="800" text-anchor="middle" fill="#070b14">1</text>
<text x="122" y="88" font-size="26" font-weight="700" fill="#f2f5fc">SDK in your app</text>
<text x="84" y="126" font-size="20" fill="#a9b4cd">A Proxy over fetch records</text>
<text x="84" y="152" font-size="20" fill="#a9b4cd">which fields your code reads.</text>
<rect x="76" y="190" width="280" height="60" rx="10" fill="#080c18" stroke="#1c2742"/>
<text x="90" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="600" fill="#59d9a0">courier.phone</text>
<text x="90" y="238" font-size="18" fill="#6f7c99">paths only, never values</text>
</g>
<path d="M388 150 H428" stroke="#6f7c99" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/>
<g id="step-2">
<rect x="440" y="36" width="320" height="228" rx="18" fill="#0e1424" stroke="#1c2742"/>
<rect x="440" y="36" width="320" height="5" rx="2.5" fill="#6ea8ff"/>
<circle cx="478" cy="80" r="17" fill="#6ea8ff"/><text x="478" y="87" font-size="20" font-weight="800" text-anchor="middle" fill="#070b14">2</text>
<text x="506" y="88" font-size="26" font-weight="700" fill="#f2f5fc">Collector</text>
<text x="468" y="126" font-size="20" fill="#a9b4cd">Counts reads and active</text>
<text x="468" y="152" font-size="20" fill="#a9b4cd">installs per field and</text>
<text x="468" y="178" font-size="20" fill="#a9b4cd">app version.</text>
<rect x="460" y="190" width="280" height="60" rx="10" fill="#080c18" stroke="#1c2742"/>
<text x="474" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="600" fill="#6ea8ff">ios 4.3.1 → phone</text>
<text x="474" y="238" font-size="18" fill="#6f7c99">Node + SQLite</text>
</g>
<path d="M772 150 H812" stroke="#6f7c99" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/>
<g id="step-3">
<rect x="824" y="36" width="320" height="228" rx="18" fill="#0e1424" stroke="#1c2742"/>
<rect x="824" y="36" width="320" height="5" rx="2.5" fill="#c08bff"/>
<circle cx="862" cy="80" r="17" fill="#c08bff"/><text x="862" y="87" font-size="20" font-weight="800" text-anchor="middle" fill="#070b14">3</text>
<text x="890" y="88" font-size="26" font-weight="700" fill="#f2f5fc">CI check</text>
<text x="852" y="126" font-size="20" fill="#a9b4cd">Diffs your OpenAPI spec,</text>
<text x="852" y="152" font-size="20" fill="#a9b4cd">joins it with real reads,</text>
<text x="852" y="178" font-size="20" fill="#a9b4cd">fails the PR that breaks users.</text>
<rect x="844" y="190" width="280" height="60" rx="10" fill="#080c18" stroke="#1c2742"/>
<text x="858" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="600" fill="#c08bff">100% affected → exit 1</text>
<text x="858" y="238" font-size="18" fill="#6f7c99">breakwater check</text>
</g>
</svg>